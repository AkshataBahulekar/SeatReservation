server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:seats}
    username: ${DATABASE_USERNAME:seats}
    password: ${DATABASE_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      connection-timeout: 30000
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
reservation:
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  user-token-secret: ${USER_TOKEN_SECRET:local-development-secret-change-me}
